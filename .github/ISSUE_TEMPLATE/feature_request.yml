name: "\U00002728 Feature request"
description: Suggest an improvement or a new capability for MavisX.
title: "[Feature]: "
labels: ["enhancement", "needs-triage", "tester-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape MavisX! Tell us what you're trying to do — not just the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need?
      description: What are you trying to accomplish that MavisX makes hard or impossible today?
      placeholder: I manage 30 hosts and can't tag/group connections, so the list is hard to scan.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you'd like.
      placeholder: Let me add colored tags to connections and filter the list by tag.
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Which area?
      options:
        - Monitors / uptime
        - SSH terminal
        - SFTP file manager
        - Docker manager
        - Credential vault
        - Alerts / notifications
        - Network toolkit
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Alternatives you've considered, mockups, or examples from other tools.
      placeholder: Optional.
    validations:
      required: false
